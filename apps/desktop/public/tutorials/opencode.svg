<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">OpenCode: a terminal coding session</title><desc id="desc">Terminal: Open repository → Provider: Select model → Session: Ask + act → Changes: Inspect + test. Keep the terminal session rooted in the intended repository.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="36" y="40" class="eyebrow" text-anchor="start">WORKFLOW SCHEMATIC</text><text x="36" y="83" class="heading" text-anchor="start">OpenCode: a terminal coding session</text><rect x="36" y="158" width="204" height="124" rx="8" class="box"/><text x="56" y="198" class="label" text-anchor="start">Terminal</text><text x="56" y="233" class="sub" text-anchor="start">Open repository</text><path d="M242 220 H258" class="arrow" marker-end="url(#head)"/><rect x="264" y="158" width="204" height="124" rx="8" class="box"/><text x="284" y="198" class="label" text-anchor="start">Provider</text><text x="284" y="233" class="sub" text-anchor="start">Select model</text><path d="M470 220 H486" class="arrow" marker-end="url(#head)"/><rect x="492" y="158" width="204" height="124" rx="8" class="focus"/><text x="512" y="198" class="label" text-anchor="start">Session</text><text x="512" y="233" class="sub" text-anchor="start">Ask + act</text><path d="M698 220 H714" class="arrow" marker-end="url(#head)"/><rect x="720" y="158" width="204" height="124" rx="8" class="box"/><text x="740" y="198" class="label" text-anchor="start">Changes</text><text x="740" y="233" class="sub" text-anchor="start">Inspect + test</text><rect x="36" y="340" width="888" height="48" rx="6" fill="#eaf2f8"/><text x="56" y="371" class="sub" text-anchor="start">Keep the terminal session rooted in the intended repository.</text></svg>
