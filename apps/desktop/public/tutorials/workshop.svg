<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">نقشهٔ مسیر کارگاه دو روزه</title><desc id="desc">روز اول نصب و اتصال و اولین پروژه و اولین کامیت؛ روز دوم اسکیل‌ها و دیباگ و بازبینی و پروژهٔ پایانی روی GitHub.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:600}.step{font-size:19px;font-weight:600}.num{font-size:17px;fill:#237e84;font-weight:700}.sub{font-size:18px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}.day{font-size:22px;font-weight:700;fill:#18324b}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="924" y="40" class="eyebrow" text-anchor="start" direction="rtl">نقشهٔ مسیر کارگاه</text><text x="924" y="82" class="heading" text-anchor="start" direction="rtl">برنامه‌نویسی با هوش مصنوعی برای مبتدیان</text><text x="924" y="128" class="day" text-anchor="start" direction="rtl">روز ۱ — نصب و اولین ساخته</text><rect x="708" y="150" width="216" height="92" rx="8" class="focus"/><text x="900" y="184" class="num" text-anchor="start" direction="rtl">گام ۱</text><text x="900" y="216" class="step" text-anchor="start" direction="rtl">نصب وایب‌هاب و اپ</text><rect x="468" y="150" width="216" height="92" rx="8" class="focus"/><text x="660" y="184" class="num" text-anchor="start" direction="rtl">گام ۲</text><text x="660" y="216" class="step" text-anchor="start" direction="rtl">اتصال مدل رایگان</text><rect x="228" y="150" width="216" height="92" rx="8" class="focus"/><text x="420" y="184" class="num" text-anchor="start" direction="rtl">گام ۳</text><text x="420" y="216" class="step" text-anchor="start" direction="rtl">اولین پروژه با دستیار</text><rect x="36" y="150" width="168" height="92" rx="8" class="focus"/><text x="180" y="184" class="num" text-anchor="start" direction="rtl">گام ۴</text><text x="180" y="216" class="step" text-anchor="start" direction="rtl">اولین کامیت Git</text><path d="M708 196 H686" class="arrow" marker-end="url(#head)"/><path d="M468 196 H446" class="arrow" marker-end="url(#head)"/><path d="M228 196 H206" class="arrow" marker-end="url(#head)"/><text x="924" y="286" class="day" text-anchor="start" direction="rtl">روز ۲ — مهارت و همکاری</text><rect x="708" y="308" width="216" height="92" rx="8" class="box"/><text x="900" y="342" class="num" text-anchor="start" direction="rtl">گام ۵</text><text x="900" y="374" class="step" text-anchor="start" direction="rtl">اسکیل‌ها و دیباگ</text><rect x="468" y="308" width="216" height="92" rx="8" class="box"/><text x="660" y="342" class="num" text-anchor="start" direction="rtl">گام ۶</text><text x="660" y="374" class="step" text-anchor="start" direction="rtl">بازبینی کد دستیار</text><rect x="228" y="308" width="216" height="92" rx="8" class="box"/><text x="420" y="342" class="num" text-anchor="start" direction="rtl">گام ۷</text><text x="420" y="374" class="step" text-anchor="start" direction="rtl">GitHub و مدیریت تغییر</text><rect x="36" y="308" width="168" height="92" rx="8" class="box"/><text x="180" y="342" class="num" text-anchor="start" direction="rtl">گام ۸</text><text x="180" y="374" class="step" text-anchor="start" direction="rtl">پروژهٔ پایانی</text><path d="M708 354 H686" class="arrow" marker-end="url(#head)"/><path d="M468 354 H446" class="arrow" marker-end="url(#head)"/><path d="M228 354 H206" class="arrow" marker-end="url(#head)"/></svg>
