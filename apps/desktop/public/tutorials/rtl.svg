<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">RTL: separate text direction from code direction</title><desc id="desc">A right-to-left prose region and a left-to-right code region coexist. Verify selection, punctuation and scrolling.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="36" y="40" class="eyebrow" text-anchor="start">WORKFLOW SCHEMATIC</text><text x="36" y="83" class="heading" text-anchor="start">RTL: separate text direction from code direction</text><rect x="36" y="122" width="422" height="182" rx="8" class="focus"/><text x="432" y="158" class="label" text-anchor="end">RTL text region</text><path d="M404 192 H96 M404 218 H156 M404 244 H116" stroke="#23868a" stroke-width="8" stroke-linecap="round"/><path d="M408 278 H84" class="arrow"  marker-end="url(#head)"/><rect x="482" y="122" width="442" height="182" rx="8" class="box"/><text x="506" y="158" class="label" text-anchor="start">LTR code region</text><text x="506" y="202" class="sub" text-anchor="start">const label = "example";</text><text x="506" y="238" class="sub" text-anchor="start">render(label);</text><path d="M510 278 H890" class="arrow"  marker-end="url(#head)"/><rect x="36" y="340" width="888" height="48" rx="6" fill="#eaf2f8"/><text x="56" y="371" class="sub" text-anchor="start">Verify mixed text, punctuation, selection, and horizontal scrolling.</text></svg>
