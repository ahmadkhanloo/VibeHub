<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Documents: inspect before editing</title><desc id="desc">PDF, Word, Excel and PowerPoint inputs feed an inspect, edit, render and verify workflow.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="36" y="40" class="eyebrow" text-anchor="start">WORKFLOW SCHEMATIC</text><text x="36" y="83" class="heading" text-anchor="start">Documents: inspect before editing</text><rect x="36" y="110" width="176" height="44" rx="8" class="box"/><text x="56" y="139" class="label" text-anchor="start">PDF</text><rect x="36" y="162" width="176" height="44" rx="8" class="box"/><text x="56" y="191" class="label" text-anchor="start">Word</text><rect x="36" y="214" width="176" height="44" rx="8" class="box"/><text x="56" y="243" class="label" text-anchor="start">Excel</text><rect x="36" y="266" width="176" height="44" rx="8" class="box"/><text x="56" y="295" class="label" text-anchor="start">PowerPoint</text><path d="M224 135 H248 V216 H276" class="arrow"  marker-end="url(#head)"/><path d="M224 187 H248" class="arrow"  marker-end="url(#head)"/><path d="M224 239 H248" class="arrow"  marker-end="url(#head)"/><path d="M224 291 H248 V216" class="arrow"  marker-end="url(#head)"/><rect x="286" y="164" width="190" height="112" rx="8" class="focus"/><text x="306" y="204" class="label" text-anchor="start">Read / inspect</text><text x="306" y="239" class="sub" text-anchor="start">Content + layout</text><path d="M484 220 H510" class="arrow" marker-end="url(#head)"/><rect x="520" y="164" width="154" height="112" rx="8" class="box"/><text x="540" y="204" class="label" text-anchor="start">Edit</text><text x="540" y="239" class="sub" text-anchor="start">Keep intent</text><path d="M682 220 H708" class="arrow" marker-end="url(#head)"/><rect x="718" y="164" width="206" height="112" rx="8" class="box"/><text x="738" y="204" class="label" text-anchor="start">Render + verify</text><text x="738" y="239" class="sub" text-anchor="start">Final appearance</text><rect x="36" y="340" width="888" height="48" rx="6" fill="#eaf2f8"/><text x="56" y="371" class="sub" text-anchor="start">Inspect the rendered file as well as the underlying content.</text></svg>
