[package]
name = "vibehub"
version = "0.1.0"
description = "Free and open-source desktop hub for AI coding tools"
authors = ["VibeHub contributors"]
license = "MIT"
repository = "https://github.com/ahmadkhanloo/VibeHub"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vibehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "socks", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = "0.4"
semver = "1"
base64 = "0.23"
