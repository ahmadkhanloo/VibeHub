name: Production Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-vibehub-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-vibehub-rust-

      - name: Confirm release tag and protected-branch ancestry
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a semantic version: $tag"
          }
          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch protected main branch for ancestry validation' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already reachable from main' }

          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tagVersion = $tag.Substring(1)
          $baseVersion = ($tagVersion -split '[+-]', 2)[0]
          if ($baseVersion -ne $config.version) { throw "Tag $tag does not match Tauri base version $($config.version)" }
          if ($tag -notmatch '-') {
            $matrix = Get-Content 'docs/validation/VibeHub_Release_Acceptance_Matrix.md' -Raw
            $gateRows = @($matrix -split '\r?\n' | Where-Object { $_ -match '^\| Gate 18\b' })
            if ($gateRows.Count -eq 0) { throw 'Stable release blocked: the acceptance matrix has no Gate 18 rows.' }
            $pendingRows = @($gateRows | Where-Object { $_ -notmatch '^\| Gate 18\b.*\| PASS \|' })
            # Owner-authorized releases: retain unverified Gate 18 results and disclose them.
            if ($pendingRows.Count -gt 0 -and $tag -in @('v0.2.0', 'v0.2.1')) {
              "Owner-authorized $tag release exception; Gate 18 remains unverified:`n$($pendingRows -join "`n")" | Add-Content $env:GITHUB_STEP_SUMMARY
            } elseif ($pendingRows.Count -gt 0) {
              throw "Stable release blocked until Gate 18 is PASS for every scenario:`n$($pendingRows -join "`n")"
            }
          }
          $releaseConfigPath = 'apps/desktop/src-tauri/tauri.release.conf.json'
          $releaseConfig = Get-Content $releaseConfigPath -Raw | ConvertFrom-Json
          $releaseConfig | Add-Member -MemberType NoteProperty -Name version -Value $tagVersion -Force
          $releaseConfigJson = ($releaseConfig | ConvertTo-Json -Depth 20) + [Environment]::NewLine
          [IO.File]::WriteAllText($releaseConfigPath, $releaseConfigJson, [Text.UTF8Encoding]::new($false))

      - name: Refuse to overwrite a published Release and reset any stale draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $json = gh release view $tag --json isDraft --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            "No existing Release for $tag; a fresh draft will be created." | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $release = $json | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release $tag is already published and its assets are treated as immutable. Cut a new patch tag instead of republishing."
          }
          gh release delete $tag --yes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not reset the stale draft Release $tag" }
          "Deleted the stale draft Release for $tag; this run starts from a clean draft. The tag ref is preserved." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.15.0
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare checksum-pinned Node.js and RTL installer payload
        shell: pwsh
        run: ./scripts/prepare-windows-rtl-payload.ps1

      - name: Run release preflight
        run: |
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm i18n:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm content:validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm release:guard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/qoder-discovery.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/rtl-paths.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/native-array-results.ps1
          ./tests/updater-signature-exit.ps1
          ./tests/native-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/rtl-setup.ps1

      - name: Verify private runtime resolution and Unicode path persistence
        shell: pwsh
        run: ./tests/rtl-paths.ps1

      - name: Require updater signing configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Set the TAURI_SIGNING_PRIVATE_KEY production secret before releasing.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Set the TAURI_SIGNING_PRIVATE_KEY_PASSWORD production secret before releasing.' }
          node scripts/configure-updater-public-key.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed Windows installers and create a draft Release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: VibeHub ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Render the public Release body
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $prerelease = if ($tag -match '-') { 'true' } else { 'false' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'vibehub-generated-notes.md'
          gh release view $tag --json body -q .body --repo $env:GITHUB_REPOSITORY | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the generated Release notes from the draft Release' }
          $bodyPath = Join-Path $env:RUNNER_TEMP 'vibehub-release-body.md'
          node scripts/render-release-body.mjs .github/release-body.md $bodyPath $tag $version $prerelease $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the public Release body from its template' }
          gh release edit $tag --notes-file $bodyPath --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply the rendered Release body to the draft Release' }

      - name: Publish Setup as VibeHub-Setup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json assets --repo $env:GITHUB_REPOSITORY | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect draft assets before renaming the Setup download' }

          $alias = @($release.assets | Where-Object name -ceq 'VibeHub-Setup.exe')
          if ($alias.Count -gt 0) {
            gh release delete-asset $tag 'VibeHub-Setup.exe' --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the existing VibeHub-Setup.exe draft asset' }
          }
          $aliasSignature = @($release.assets | Where-Object name -ceq 'VibeHub-Setup.exe.sig')
          if ($aliasSignature.Count -gt 0) {
            gh release delete-asset $tag 'VibeHub-Setup.exe.sig' --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the existing VibeHub-Setup.exe.sig draft asset' }
          }

          $setups = @($release.assets | Where-Object { $_.name -match 'setup\.exe$' -and $_.name -cne 'VibeHub-Setup.exe' })
          if ($setups.Count -ne 1) { throw 'Expected one Tauri-generated NSIS Setup executable before assigning the stable download name' }

          $verifyDir = Join-Path $env:RUNNER_TEMP 'vibehub-setup-rename-check'
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $tag --pattern 'latest.json' --dir $verifyDir --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect latest.json before renaming the standard Setup asset' }
          gh release download $tag --pattern '*.sig' --dir $verifyDir --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not download updater signatures' }
          $releasePath = Join-Path $verifyDir 'release.json'
          [IO.File]::WriteAllText($releasePath, ($release | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))
          node scripts/normalize-updater-release.mjs (Join-Path $verifyDir 'latest.json') $releasePath $verifyDir "$env:GITHUB_REPOSITORY" "$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not normalize public signed updater URLs' }
          $latest = Get-Content (Join-Path $verifyDir 'latest.json') -Raw | ConvertFrom-Json
          if (-not $latest.platforms) { throw 'latest.json has no updater platforms after normalization' }
          $canonicalBase = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$([Uri]::EscapeDataString($tag))/"
          foreach ($platform in $latest.platforms.PSObject.Properties) {
            $updaterUrl = [string]$platform.Value.url
            if ($updaterUrl -match 'untagged-') { throw "Updater URL must never reference a draft upload: $updaterUrl" }
            if (-not $updaterUrl.StartsWith($canonicalBase, [StringComparison]::Ordinal)) { throw "Updater URL must use the canonical tagged release path: $updaterUrl" }
            $updaterName = [Uri]::UnescapeDataString((([Uri]$updaterUrl).AbsolutePath -split '/')[-1])
            if ($updaterName -notmatch '\.nsis\.zip$') { throw "Tauri updater URL must target its signed NSIS archive before renaming Setup: $updaterName" }
          }
          gh release upload $tag (Join-Path $verifyDir 'latest.json') --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload normalized updater metadata' }

          gh release download $tag --pattern $setups[0].name --dir $verifyDir --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the Tauri-generated Setup executable' }
          $source = Join-Path $verifyDir $setups[0].name
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'The Tauri-generated Setup executable is missing after download' }
          $versionedSignature = Join-Path $verifyDir "$($setups[0].name).sig"
          if (-not (Test-Path -LiteralPath $versionedSignature -PathType Leaf)) { throw 'Setup signature is missing' }
          $stableSetup = Join-Path $env:RUNNER_TEMP 'VibeHub-Setup.exe'
          $stableSignature = "$stableSetup.sig"
          Copy-Item -LiteralPath $source -Destination $stableSetup -Force
          Copy-Item -LiteralPath $versionedSignature -Destination $stableSignature -Force
          if ((Get-FileHash -LiteralPath $stableSetup -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash) {
            throw 'Stable Setup copy does not match the Tauri-generated executable'
          }
          # Upload the user-facing alias first so a mid-step failure never leaves the draft without a Setup download.
          gh release upload $tag $stableSetup $stableSignature --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload VibeHub-Setup.exe and its signature to the draft Release' }
          gh release delete-asset $tag $setups[0].name --yes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the versioned Setup asset after the stable alias was uploaded' }
          gh release delete-asset $tag "$($setups[0].name).sig" --yes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the versioned Setup signature after the stable alias was uploaded' }

      - name: Generate and attach CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: .
          format: cyclonedx-json
          artifact-name: VibeHub-SBOM.cdx.json
          output-file: VibeHub-SBOM.cdx.json
          upload-release-assets: true

      - name: Attach source and license notices
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sourceArchive = Join-Path $env:RUNNER_TEMP "VibeHub-$env:GITHUB_REF_NAME-source.zip"
          git archive --format=zip --output=$sourceArchive $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the tagged source archive' }
          gh release upload $env:GITHUB_REF_NAME $sourceArchive LICENSE docs/legal/THIRD_PARTY_LICENSES.md --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the source archive and license notices to the draft Release' }

      - name: Install Minisign verifier
        shell: pwsh
        run: |
          $version = '0.12'
          $archiveName = "minisign-$version-win64.zip"
          $releaseBase = "https://github.com/jedisct1/minisign/releases/download/$version"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $signaturePath = "$archivePath.minisig"
          $extractPath = Join-Path $env:RUNNER_TEMP 'minisign-verifier'
          Invoke-WebRequest -Uri "$releaseBase/$archiveName" -OutFile $archivePath
          Invoke-WebRequest -Uri "$releaseBase/$archiveName.minisig" -OutFile $signaturePath

          $expectedHash = '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479'
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Minisign verifier archive SHA-256 mismatch: $actualHash" }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $minisign = Join-Path $extractPath 'minisign-win64\x86_64\minisign.exe'
          if (-not (Test-Path -LiteralPath $minisign -PathType Leaf)) { throw 'Minisign executable is missing from the pinned release archive' }
          $minisignPublisherKey = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
          & $minisign -Vm $archivePath -x $signaturePath -P $minisignPublisherKey
          if ($LASTEXITCODE -ne 0) { throw 'Minisign verifier archive publisher signature is invalid' }
          'Minisign 0.12 verifier archive checksum and publisher signature verified.'

      - name: Verify signing roundtrip and reject tampered payload
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $minisign = Join-Path $env:RUNNER_TEMP 'minisign-verifier/minisign-win64/x86_64/minisign.exe'
          ./tests/updater-signature.ps1 -Minisign $minisign

      - name: Verify draft artifacts and prepare SHA-256 manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $minisign = Join-Path $env:RUNNER_TEMP 'minisign-verifier/minisign-win64/x86_64/minisign.exe'
          $tag = $env:GITHUB_REF_NAME
          $downloadDir = Join-Path $env:RUNNER_TEMP 'vibehub-release-draft'
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'vibehub-updater-public-key.txt'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $decodedPublicKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_UPDATER_PUBLIC_KEY.Trim()))
          [System.IO.File]::WriteAllText($publicKeyPath, $decodedPublicKey, [System.Text.UTF8Encoding]::new($false))
          gh release download $tag --dir $downloadDir --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not download all draft Release assets for verification' }

          $assets = @(Get-ChildItem -LiteralPath $downloadDir -File)
          $installers = @($assets | Where-Object { $_.Name -match 'setup\.exe$' })
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows Setup executable in the draft Release' }
          if ($installers[0].Name -cne 'VibeHub-Setup.exe') { throw 'The user-facing Windows Setup must be named VibeHub-Setup.exe' }
          if (-not ($assets.Name -contains 'latest.json')) { throw 'Tauri updater latest.json is missing' }
          if (-not ($assets.Name -contains 'VibeHub-SBOM.cdx.json')) { throw 'CycloneDX SBOM is missing' }
          if (-not ($assets.Name -contains 'LICENSE')) { throw 'MIT license notice is missing' }
          if (-not ($assets.Name -contains 'THIRD_PARTY_LICENSES.md')) { throw 'Third-party license notice is missing' }
          if (-not (@($assets | Where-Object Name -like '*-source.zip').Count)) { throw 'Tagged source archive is missing' }

          $latest = Get-Content (Join-Path $downloadDir 'latest.json') -Raw | ConvertFrom-Json
          if (-not $latest.platforms) { throw 'latest.json has no updater platforms' }
          $expectedVersion = $tag.Substring(1)
          if (($latest.version -replace '^v', '') -ne $expectedVersion) { throw "latest.json version does not match release tag $tag" }
          $canonicalBase = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$([Uri]::EscapeDataString($tag))/"
          foreach ($platform in $latest.platforms.PSObject.Properties) {
            if ([string]::IsNullOrWhiteSpace([string]$platform.Value.url) -or [string]::IsNullOrWhiteSpace([string]$platform.Value.signature)) {
              throw "latest.json has an incomplete updater entry for $($platform.Name)"
            }
            $updaterUrl = [string]$platform.Value.url
            if ($updaterUrl -match 'untagged-') { throw "Refusing to publish a manifest with a draft upload URL: $updaterUrl" }
            if (-not $updaterUrl.StartsWith($canonicalBase, [StringComparison]::Ordinal)) { throw "Refusing to publish a non-canonical updater URL: $updaterUrl" }
            $updaterUri = [Uri]$updaterUrl
            $assetName = [Uri]::UnescapeDataString(($updaterUri.AbsolutePath -split '/')[-1])
            if ($assetName -notmatch '\.nsis\.zip$') { throw "Updater URL must point to the signed NSIS updater bundle, not the standard Setup executable: $assetName" }
            if (-not ($assets.Name -contains $assetName)) { throw "Updater URL has no matching Release asset: $assetName" }
            $assetSignaturePath = Join-Path $downloadDir "$assetName.sig"
            if (-not (Test-Path -LiteralPath $assetSignaturePath)) { throw "Updater JSON has no signed Release asset: $assetName" }
            $assetSignature = (Get-Content -LiteralPath $assetSignaturePath -Raw).Trim()
            if ($assetSignature -ne ([string]$platform.Value.signature).Trim()) { throw "Updater JSON signature does not match the signed Release asset: $assetName" }
          }

          foreach ($signature in @($assets | Where-Object Name -like '*.sig')) {
            $payloadPath = $signature.FullName.Substring(0, $signature.FullName.Length - 4)
            if (-not (Test-Path -LiteralPath $payloadPath)) { throw "Signature has no matching payload: $($signature.Name)" }
            $decodedSignaturePath = Join-Path $env:RUNNER_TEMP 'vibehub-signature.minisig'
            $decodedSignature = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content -LiteralPath $signature.FullName -Raw).Trim()))
            [IO.File]::WriteAllText($decodedSignaturePath, $decodedSignature, [Text.UTF8Encoding]::new($false))
            & $minisign -Vm $payloadPath -x $decodedSignaturePath -p $publicKeyPath
            if ($LASTEXITCODE -ne 0) { throw "Minisign verification failed for $($signature.Name)" }
          }

          $manifestPath = Join-Path $downloadDir 'checksums-sha256.txt'
          $lines = @($assets | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          [System.IO.File]::WriteAllLines($manifestPath, $lines, [System.Text.UTF8Encoding]::new($false))
          gh release upload $tag $manifestPath --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the SHA-256 manifest' }

      - name: Publish the verified Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if ($env:RELEASE_IS_PRERELEASE -eq 'true') {
            gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease --repo $env:GITHUB_REPOSITORY
          } else {
            gh release edit $env:GITHUB_REF_NAME --draft=false --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified draft Release' }

      - name: Verify public downloads, checksums, and signatures
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $minisign = Join-Path $env:RUNNER_TEMP 'minisign-verifier/minisign-win64/x86_64/minisign.exe'
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json assets,isDraft,url --repo $env:GITHUB_REPOSITORY | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the published Release' }
          if ($release.isDraft) { throw 'Release is still a draft' }
          $publicDir = Join-Path $env:RUNNER_TEMP 'vibehub-public-release'
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'vibehub-updater-public-key.txt'
          New-Item -ItemType Directory -Path $publicDir -Force | Out-Null
          $decodedPublicKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_UPDATER_PUBLIC_KEY.Trim()))
          [System.IO.File]::WriteAllText($publicKeyPath, $decodedPublicKey, [System.Text.UTF8Encoding]::new($false))

          foreach ($asset in $release.assets) {
            $url = $asset.url
            if ([string]::IsNullOrWhiteSpace($url)) { throw "Release asset has no browser download URL: $($asset.name)" }
            $target = Join-Path $publicDir $asset.name
            Invoke-WebRequest -Uri $url -OutFile $target -MaximumRedirection 10
          }
          $checksumPath = Join-Path $publicDir 'checksums-sha256.txt'
          if (-not (Test-Path $checksumPath)) { throw 'Published SHA-256 manifest cannot be downloaded publicly' }
          $expected = @{}
          foreach ($line in Get-Content $checksumPath) {
            if ($line -match '^([0-9a-fA-F]{64})  (.+)$') { $expected[$Matches[2]] = $Matches[1].ToLowerInvariant() }
            else { throw "Invalid SHA-256 manifest line: $line" }
          }
          foreach ($asset in $release.assets | Where-Object name -ne 'checksums-sha256.txt') {
            if (-not $expected.ContainsKey($asset.name)) { throw "Published checksum missing for $($asset.name)" }
            $actual = (Get-FileHash -LiteralPath (Join-Path $publicDir $asset.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$asset.name]) { throw "Public download checksum mismatch for $($asset.name)" }
          }
          foreach ($signature in @(Get-ChildItem -LiteralPath $publicDir -File | Where-Object Name -like '*.sig')) {
            $payloadPath = $signature.FullName.Substring(0, $signature.FullName.Length - 4)
            $decodedSignaturePath = Join-Path $env:RUNNER_TEMP 'vibehub-public-signature.minisig'
            $decodedSignature = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content -LiteralPath $signature.FullName -Raw).Trim()))
            [IO.File]::WriteAllText($decodedSignaturePath, $decodedSignature, [Text.UTF8Encoding]::new($false))
            & $minisign -Vm $payloadPath -x $decodedSignaturePath -p $publicKeyPath
            if ($LASTEXITCODE -ne 0) { throw "Public updater signature verification failed for $($signature.Name)" }
          }
          "Verified publicly downloadable Release: $($release.url)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Verify tagged updater manifest and asset reachability
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $repository = $env:GITHUB_REPOSITORY
          $base = "https://github.com/$repository/releases/download/$([Uri]::EscapeDataString($tag))"
          $manifestUrl = "$base/latest.json"

          $manifestResponse = Invoke-WebRequest -Uri $manifestUrl -MaximumRedirection 10
          if ($manifestResponse.StatusCode -ne 200) { throw "Tagged updater manifest is not publicly reachable: $manifestUrl" }
          $manifest = $manifestResponse.Content | ConvertFrom-Json
          if (-not $manifest.platforms) { throw 'Public tagged manifest has no updater platforms' }
          if (($manifest.version -replace '^v', '') -ne $version) { throw "Public tagged manifest version does not match $tag" }

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $updaterUrl = [string]$platform.Value.url
            if ($updaterUrl -match 'untagged-') { throw "Public updater URL references a draft upload: $updaterUrl" }
            if (-not $updaterUrl.StartsWith("$base/", [StringComparison]::Ordinal)) { throw "Public updater URL is not the canonical tagged download: $updaterUrl" }
            $archiveResponse = Invoke-WebRequest -Uri $updaterUrl -Method Head -MaximumRedirection 10
            if ($archiveResponse.StatusCode -ne 200) { throw "Signed updater archive is not publicly reachable: $updaterUrl" }
            $signatureUrl = "$updaterUrl.sig"
            $signatureResponse = Invoke-WebRequest -Uri $signatureUrl -MaximumRedirection 10
            if ($signatureResponse.StatusCode -ne 200) { throw "Updater signature is not publicly reachable: $signatureUrl" }
            if ($signatureResponse.Content.Trim() -ne ([string]$platform.Value.signature).Trim()) {
              throw "Public updater signature differs from latest.json: $signatureUrl"
            }
          }

          $releaseInfo = gh release view $tag --json isLatest,isPrerelease --repo $repository | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine whether this Release is the latest stable Release' }
          if ($env:RELEASE_IS_PRERELEASE -eq 'false' -and $releaseInfo.isLatest) {
            $latestUrl = "https://github.com/$repository/releases/latest/download/latest.json"
            $matched = $false
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                $candidate = (Invoke-WebRequest -Uri $latestUrl -MaximumRedirection 10).Content | ConvertFrom-Json
                if (($candidate.version -replace '^v', '') -eq $version) { $matched = $true; break }
                Write-Host "releases/latest still serves $($candidate.version); retrying."
              } catch {
                Write-Host "releases/latest check attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 10
            }
            if (-not $matched) { throw "releases/latest/download/latest.json does not serve $version after publication" }
          } elseif ($env:RELEASE_IS_PRERELEASE -eq 'true') {
            "Skipping releases/latest check: $tag is a prerelease." | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "Skipping releases/latest check: an existing newer stable Release is latest." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "Public tagged manifest, updater archive, signature, and latest-release manifest verified for $tag." | Add-Content $env:GITHUB_STEP_SUMMARY
