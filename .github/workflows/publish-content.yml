name: Publish VibeHub content feed

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "docs/tutorials/**"
      - "scripts/build-content-site.mjs"
      - "scripts/validate-content.mjs"
      - "scripts/collect-offers.mjs"
      - "packages/core/src/schemas.ts"
      - ".github/workflows/publish-content.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibehub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.15.0
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Collect official public offers
        env:
          PREVIOUS_FEED_URL: ${{ steps.pages.outputs.base_url }}/feed
        run: node scripts/collect-offers.mjs

      - name: Validate content and feed assembly
        run: |
          pnpm content:validate
          node --test tests/content-site.test.mjs

      - name: Build static Pages artifact
        run: node scripts/build-content-site.mjs "$RUNNER_TEMP/vibehub-content-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v3
        with:
          path: ${{ runner.temp }}/vibehub-content-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
