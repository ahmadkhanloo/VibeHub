<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Long tasks: preserve progress at checkpoints</title><desc id="desc">A scoped task advances through work blocks with durable checkpoints and a final verification.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="36" y="40" class="eyebrow" text-anchor="start">WORKFLOW SCHEMATIC</text><text x="36" y="83" class="heading" text-anchor="start">Long tasks: preserve progress at checkpoints</text><rect x="36" y="158" width="180" height="124" rx="8" class="box"/><text x="56" y="198" class="label" text-anchor="start">Scope</text><text x="56" y="233" class="sub" text-anchor="start">Done criteria</text><path d="M224 220 H246" class="arrow" marker-end="url(#head)"/><rect x="256" y="158" width="192" height="124" rx="8" class="box"/><text x="276" y="198" class="label" text-anchor="start">Work block</text><text x="276" y="233" class="sub" text-anchor="start">Bounded progress</text><path d="M456 220 H478" class="arrow" marker-end="url(#head)"/><rect x="488" y="158" width="214" height="124" rx="8" class="focus"/><text x="508" y="198" class="label" text-anchor="start">Checkpoint</text><text x="508" y="233" class="sub" text-anchor="start">State + next step</text><path d="M710 220 H732" class="arrow" marker-end="url(#head)"/><rect x="742" y="158" width="182" height="124" rx="8" class="box"/><text x="762" y="198" class="label" text-anchor="start">Finish</text><text x="762" y="233" class="sub" text-anchor="start">Verify outcome</text><path d="M594 290 V318 H352 V290" class="arrow" stroke-dasharray="7 6" marker-end="url(#head)"/><rect x="36" y="340" width="888" height="48" rx="6" fill="#eaf2f8"/><text x="56" y="371" class="sub" text-anchor="start">Save decisions, completed work, and the next action between blocks.</text></svg>
