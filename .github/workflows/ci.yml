name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POSIX scripts (shellcheck + bash -n)
        run: |
          shellcheck -S warning apps/ZCode/launch.sh install.sh
          bash -n apps/ZCode/launch.sh install.sh

      - name: JavaScript (node --check)
        run: |
          find apps -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: PowerShell (parser)
        shell: pwsh
        run: |
          $files = @('install.ps1', 'cleanup.ps1') + (Get-ChildItem apps -Recurse -Filter '*.ps1' | ForEach-Object FullName)
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          }
          'PowerShell scripts parse OK'

      - name: Workflow YAML
        run: python3 -c "import yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in ['.github/workflows/ci.yml', '.github/workflows/release.yml']] and print('workflows OK')"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Behavioral suite (Qoder discovery + non-ASCII path handoff)
        shell: pwsh
        run: ./tests/qoder-discovery.ps1
