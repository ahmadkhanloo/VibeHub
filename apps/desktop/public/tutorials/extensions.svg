<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Extensions: extend with a clear boundary</title><desc id="desc">A specific need leads to an extension, a permission review and a small verification.</desc><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px;fill:#50657a}.eyebrow{font-size:20px;fill:#237e84;font-weight:700}.box{fill:#fff;stroke:#b9cad8;stroke-width:2}.focus{fill:#e5f5f3;stroke:#23868a;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2}</style><rect width="960" height="420" rx="12" fill="#f6f9fc"/><text x="36" y="40" class="eyebrow" text-anchor="start">WORKFLOW SCHEMATIC</text><text x="36" y="83" class="heading" text-anchor="start">Extensions: extend with a clear boundary</text><rect x="36" y="158" width="190" height="124" rx="8" class="box"/><text x="56" y="198" class="label" text-anchor="start">Need</text><text x="56" y="233" class="sub" text-anchor="start">Missing capability</text><path d="M234 220 H258" class="arrow" marker-end="url(#head)"/><rect x="268" y="158" width="204" height="124" rx="8" class="focus"/><text x="288" y="198" class="label" text-anchor="start">Extension</text><text x="288" y="233" class="sub" text-anchor="start">Check provenance</text><path d="M480 220 H504" class="arrow" marker-end="url(#head)"/><rect x="514" y="158" width="190" height="124" rx="8" class="box"/><text x="534" y="198" class="label" text-anchor="start">Permissions</text><text x="534" y="233" class="sub" text-anchor="start">Read the scope</text><path d="M712 220 H736" class="arrow" marker-end="url(#head)"/><rect x="746" y="158" width="178" height="124" rx="8" class="box"/><text x="766" y="198" class="label" text-anchor="start">Small trial</text><text x="766" y="233" class="sub" text-anchor="start">Verify behavior</text><rect x="36" y="340" width="888" height="48" rx="6" fill="#eaf2f8"/><text x="56" y="371" class="sub" text-anchor="start">Enable only the capabilities needed for the current task.</text></svg>
